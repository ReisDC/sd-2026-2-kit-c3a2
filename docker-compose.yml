services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: howard-gateway
    ports:
      - "8000:8000"
    environment:
      INGESTION_URL: http://ingestion-service:8000
      RETRIEVAL_URL: http://retrieval-service:8000
      GENERATION_URL: http://generation-service:8000
    depends_on:
      - ingestion-service
      - retrieval-service
      - generation-service
    networks:
      - howard-network
    restart: unless-stopped

  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: howard-ingestion
    expose:
      - "8000"
    networks:
      - howard-network
    restart: unless-stopped

  retrieval-service:
    build:
      context: ./retrieval-service
      dockerfile: Dockerfile
    container_name: howard-retrieval
    expose:
      - "8000"
    networks:
      - howard-network
    restart: unless-stopped

  generation-service:
    build:
      context: ./generation-service
      dockerfile: Dockerfile
    container_name: howard-generation
    expose:
      - "8000"
    networks:
      - howard-network
    restart: unless-stopped

networks:
  howard-network:
    driver: bridge
