# Override de PRODUCAO (TAREFAS 5 e 8): coloca o Caddy na frente do gateway,
# com certificado HTTPS automatico (Let's Encrypt) para o dominio em DOMINIO.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Em producao so as portas 80/443 (Caddy) ficam abertas. O gateway deixa de
# publicar a 8000 e o Jaeger fica so no localhost da VM (acesso por tunel SSH).

services:
  caddy:
    image: docker.io/library/caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env (ex.: 203.0.113.10.sslip.io)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on: [gateway]
    restart: unless-stopped

  gateway:
    ports: !reset []

  jaeger:
    ports: !override ["127.0.0.1:16686:16686"]

volumes:
  caddy-dados:
  caddy-config:
